version: "3.9"

services:
  python-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "8000:8000"
    environment:
      - PYTHON_API_CORS_ORIGINS=http://localhost:5000,http://localhost:5173
      - PYTHON_API_HOST=0.0.0.0
      - PYTHON_API_PORT=8000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  node-api:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "5000:5000"
    environment:
      - PYTHON_RAG_URL=http://python-api:8000
      - FRONTEND_URL=http://localhost:5173
      - PYTHON_REQUEST_TIMEOUT=120000
    depends_on:
      - python-api
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - node-api
    restart: unless-stopped
